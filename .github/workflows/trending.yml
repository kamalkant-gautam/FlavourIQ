name: Update trending posts
on:
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_trending.py
      - run: |
          git config user.name "flavour-iq-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/trending.json; git diff --cached --quiet || (git commit -m "Update trending" && git push)
